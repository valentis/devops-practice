apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: batch-workers
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]  # Spot 우선, On-Demand 폴백
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m5.2xlarge", "m5a.2xlarge", "m5n.2xlarge", "m4.2xlarge"]
      nodeClassRef:
        name: default
      taints:
        - key: batch-only
          value: "true"
          effect: NoSchedule
  limits:
    cpu: 200
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30s
